# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "3b5893fa2c28bfdd6c2e2672b9591885"
name = "leakaudit-app"
application_url = "https://leakaudit-app.fly.dev"
embedded = true

[access_scopes]
# Strictly read-only — LeakAudit never writes to the store.
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,read_products,read_themes,read_shopify_payments_payouts"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Mandatory GDPR/CCPA compliance "webhooks" are NOT regular topic
  # subscriptions (that's why the CLI rejected them there) — they're a
  # separate, dedicated config block. Same 3 route files still handle them.
  [webhooks.privacy_compliance]
  customer_data_request_url = "/webhooks/customers/data_request"
  customer_deletion_url = "/webhooks/customers/redact"
  shop_deletion_url = "/webhooks/shop/redact"

[auth]
redirect_urls = [ "https://leakaudit-app.fly.dev/auth/callback" ]

[build]
automatically_update_urls_on_dev = true
